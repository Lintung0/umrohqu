stages:
  - install
  - lint
  - build
  - deploy

variables:
  DEPLOY_PATH: "/www/wwwroot/UmrahQu-Marketplace"

default:
  image: node:24
  tags:
    - server5

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/
    - .next/cache/


# ─────────────────────────────────────────────
# INSTALL
# ─────────────────────────────────────────────

install:
  stage: install

  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version

  script:
    - bun install --frozen-lockfile

    - echo "=== Checking Next.js dependency ==="
    - test -d node_modules
    - test -d node_modules/next
    - test -f node_modules/next/dist/bin/next
    - echo "Next.js dependency OK"

  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ─────────────────────────────────────────────
# LINT
# ─────────────────────────────────────────────

lint:
  stage: lint

  needs:
    - job: install
      artifacts: true

  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version

  script:
    - bun run lint

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ─────────────────────────────────────────────
# BUILD
# ─────────────────────────────────────────────

build:
  stage: build

  needs:
    - job: install
      artifacts: true
    - job: lint

  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version

  script:
    - echo "=== Preparing production environment ==="
    - cp "$ENV_PRODUCTION" .env.production.local

    - echo "=== Building Next.js ==="
    - bun run build

    - echo "=== Checking Next.js executable ==="
    - test -f node_modules/next/dist/bin/next
    - ls -lah node_modules/next/dist/bin/next

    - echo "=== Checking Next.js build ==="
    - test -d .next
    - ls -lah .next | head

  artifacts:
    paths:
      - .next/
      - node_modules/
      - ecosystem.config.js
      - .env.production.local
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ─────────────────────────────────────────────
# DEPLOY
# ─────────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:latest

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache rsync openssh-client

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

    - chmod 600 ~/.ssh/deploy_key
    - chmod 644 ~/.ssh/known_hosts

  script:

    # ─────────────────────────────────────────
    # CHECK ARTIFACT
    # ─────────────────────────────────────────

    - echo "=== Checking deployment artifact ==="

    - test -d .next
    - test -d node_modules
    - test -d node_modules/next
    - test -f node_modules/next/dist/bin/next
    - test -f ecosystem.config.js
    - test -f .env.production.local

    - echo "Artifact validation OK"


    # ─────────────────────────────────────────
    # PREPARE DEPLOY DIRECTORY
    # ─────────────────────────────────────────

    - echo "=== Preparing deploy directory ==="

    - mkdir -p deploy
    - cp -a .next deploy/
    - cp -a node_modules deploy/
    - cp -a ecosystem.config.js deploy/

    - echo "=== Deploy directory ==="
    - du -sh deploy/.next
    - du -sh deploy/node_modules
    - ls -lah deploy


    # ─────────────────────────────────────────
    # TEST SSH
    # ─────────────────────────────────────────

    - ssh -i ~/.ssh/deploy_key root@192.168.1.210 "echo 'SSH connection OK'"


    # ─────────────────────────────────────────
    # DEPLOY APPLICATION
    # ─────────────────────────────────────────

    - echo "=== Syncing application ==="

    - |
      rsync -az --delete \
        --exclude='.next/cache' \
        -e "ssh -i ~/.ssh/deploy_key" \
        deploy/ \
        root@192.168.1.210:${DEPLOY_PATH}/


    # ─────────────────────────────────────────
    # DEPLOY ENVIRONMENT
    # ─────────────────────────────────────────

    - echo "=== Syncing environment ==="

    - |
      rsync -az \
        --chmod=600 \
        -e "ssh -i ~/.ssh/deploy_key" \
        .env.production.local \
        root@192.168.1.210:${DEPLOY_PATH}/


    # ─────────────────────────────────────────
    # SERVER VALIDATION + PM2
    # ─────────────────────────────────────────

    - |
      ssh -i ~/.ssh/deploy_key root@192.168.1.210 << 'ENDSSH'

        set -e

        DEPLOY_PATH="/www/wwwroot/UmrahQu-Marketplace"

        echo "========================================"
        echo " DEPLOYED FILE CHECK"
        echo "========================================"


        echo ""
        echo "[1] Project directory"

        ls -lah "$DEPLOY_PATH"


        echo ""
        echo "[2] node_modules"

        if [ -d "$DEPLOY_PATH/node_modules" ]; then
          echo "OK: node_modules exists"
        else
          echo "ERROR: node_modules NOT FOUND"
          exit 1
        fi


        echo ""
        echo "[3] Next.js"

        if [ -d "$DEPLOY_PATH/node_modules/next" ]; then
          echo "OK: node_modules/next exists"
        else
          echo "ERROR: node_modules/next NOT FOUND"
          exit 1
        fi


        echo ""
        echo "[4] Next.js executable"

        if [ -f "$DEPLOY_PATH/node_modules/next/dist/bin/next" ]; then
          echo "OK: Next.js executable exists"
          ls -lah "$DEPLOY_PATH/node_modules/next/dist/bin/next"
        else
          echo "ERROR: Next.js executable NOT FOUND"
          exit 1
        fi


        echo ""
        echo "[5] Next.js build"

        if [ -d "$DEPLOY_PATH/.next" ]; then
          echo "OK: .next exists"
        else
          echo "ERROR: .next NOT FOUND"
          exit 1
        fi


        echo ""
        echo "========================================"
        echo " FIXING PERMISSIONS"
        echo "========================================"

        chown -R www:www "$DEPLOY_PATH"

        chmod 600 "$DEPLOY_PATH/.env.production.local"


        echo ""
        echo "========================================"
        echo " PM2"
        echo "========================================"


        if sudo -u www pm2 list | grep -q "UmrahQu-Marketplace"; then

          echo "Application already exists."
          echo "Reloading..."

          sudo -u www pm2 reload \
            "$DEPLOY_PATH/ecosystem.config.js" \
            --env production

        else

          echo "Application not found."
          echo "Starting..."

          sudo -u www pm2 start \
            "$DEPLOY_PATH/ecosystem.config.js" \
            --env production

        fi


        echo ""
        echo "Saving PM2 process list..."

        sudo -u www pm2 save


        echo ""
        echo "========================================"
        echo " PM2 STATUS"
        echo "========================================"

        sudo -u www pm2 status


        echo ""
        echo "========================================"
        echo " DEPLOY COMPLETE"
        echo "========================================"

      ENDSSH

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  environment:
    name: production