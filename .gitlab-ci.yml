stages:
  - install
  - lint
  - typecheck
  - build
  - deploy
  - notify

variables:
  DEPLOY_PATH: "/www/wwwroot/UmrahQu-Marketplace"
  # Pinned images (bump quarterly). Digests resolved 2026-09-18.
  NODE_IMAGE: "node:24@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0"
  ALPINE_IMAGE: "alpine:3.22@sha256:365499d9dccb7c8cfaffef995a6c382e71174585e0556f6476ead1c5971c39fb"

default:
  image: $NODE_IMAGE
  tags:
    - server5

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/
    - .next/cache/


# ─────────────────────────────────────────────
# INSTALL
# ─────────────────────────────────────────────

install:
  stage: install

  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version

  script:
    - bun install --frozen-lockfile

    - echo "=== Checking Next.js dependency ==="
    - test -d node_modules
    - test -d node_modules/next
    - test -f node_modules/next/dist/bin/next
    - echo "Next.js dependency OK"

  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ─────────────────────────────────────────────
# LINT
# ─────────────────────────────────────────────

lint:
  stage: lint

  needs:
    - job: install
      artifacts: true

  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version

  script:
    - bun run lint

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ─────────────────────────────────────────────
# TYPECHECK
# ─────────────────────────────────────────────

typecheck:
  stage: typecheck

  needs:
    - job: install
      artifacts: true

  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version

  script:
    - bun run typecheck

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ─────────────────────────────────────────────
# BUILD
# ─────────────────────────────────────────────

build:
  stage: build

  needs:
    - job: install
      artifacts: true
    - job: lint
    - job: typecheck

  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version

  script:
    - echo "=== Preparing production environment ==="
    - cp "$ENV_PRODUCTION" .env.production.local

    - echo "=== Building Next.js ==="
    - bun run build

    - echo "=== Checking Next.js executable ==="
    - test -f node_modules/next/dist/bin/next
    - ls -lah node_modules/next/dist/bin/next

    - echo "=== Checking Next.js build ==="
    - test -d .next
    - ls -lah .next | head

  artifacts:
    paths:
      - .next/
      - node_modules/
      - ecosystem.config.js
      - public/
      - next.config.ts
      - package.json
      - .env.production.local
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ─────────────────────────────────────────────
# DEPLOY
# ─────────────────────────────────────────────

deploy:
  stage: deploy
  image: $ALPINE_IMAGE
  resource_group: production-deploy
  timeout: 30m
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache rsync openssh-client

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

    - chmod 600 ~/.ssh/deploy_key
    - chmod 644 ~/.ssh/known_hosts

  script:

    # ─────────────────────────────────────────
    # CHECK ARTIFACT
    # ─────────────────────────────────────────

    - echo "=== Checking deployment artifact ==="

    - test -d .next
    - test -d node_modules
    - test -d node_modules/next
    - test -f node_modules/next/dist/bin/next
    - test -f ecosystem.config.js
    - test -d public
    - test -f next.config.ts
    - test -f package.json
    - test -f .env.production.local

    - echo "Artifact validation OK"


    # ─────────────────────────────────────────
    # PREPARE DEPLOY DIRECTORY
    # ─────────────────────────────────────────

    - echo "=== Preparing deploy directory ==="

    - mkdir -p deploy
    - cp -a .next deploy/
    - cp -a node_modules deploy/
    - cp -a ecosystem.config.js deploy/
    - cp -a public deploy/
    - cp -a next.config.ts deploy/
    - cp -a package.json deploy/

    - echo "=== Deploy directory ==="
    - du -sh deploy/.next
    - du -sh deploy/node_modules
    - du -sh deploy/public
    - ls -lah deploy


    # ─────────────────────────────────────────
    # TEST SSH
    # ─────────────────────────────────────────

    - ssh -i ~/.ssh/deploy_key root@192.168.1.210 "echo 'SSH connection OK'"


    # ─────────────────────────────────────────
    # DEPLOY APPLICATION
    # ─────────────────────────────────────────

    - echo "=== Syncing application ==="

    - |
      rsync -az --delete \
        --exclude='.next/cache' \
        -e "ssh -i ~/.ssh/deploy_key" \
        deploy/ \
        root@192.168.1.210:${DEPLOY_PATH}/


    # ─────────────────────────────────────────
    # DEPLOY ENVIRONMENT
    # ─────────────────────────────────────────

    - echo "=== Syncing environment ==="

    - |
      rsync -az \
        --chmod=600 \
        -e "ssh -i ~/.ssh/deploy_key" \
        .env.production.local \
        root@192.168.1.210:${DEPLOY_PATH}/


    # ─────────────────────────────────────────
    # SERVER VALIDATION + PM2
    # ─────────────────────────────────────────

    - |
      ssh -i ~/.ssh/deploy_key root@192.168.1.210 << 'ENDSSH'

        set -e

        DEPLOY_PATH="/www/wwwroot/UmrahQu-Marketplace"

        echo "========================================"
        echo " DEPLOYED FILE CHECK"
        echo "========================================"


        echo ""
        echo "[1] Project directory"

        ls -lah "$DEPLOY_PATH"


        echo ""
        echo "[2] node_modules"

        if [ -d "$DEPLOY_PATH/node_modules" ]; then
          echo "OK: node_modules exists"
        else
          echo "ERROR: node_modules NOT FOUND"
          exit 1
        fi


        echo ""
        echo "[3] Next.js"

        if [ -d "$DEPLOY_PATH/node_modules/next" ]; then
          echo "OK: node_modules/next exists"
        else
          echo "ERROR: node_modules/next NOT FOUND"
          exit 1
        fi


        echo ""
        echo "[4] Next.js executable"

        if [ -f "$DEPLOY_PATH/node_modules/next/dist/bin/next" ]; then
          echo "OK: Next.js executable exists"
          ls -lah "$DEPLOY_PATH/node_modules/next/dist/bin/next"
        else
          echo "ERROR: Next.js executable NOT FOUND"
          exit 1
        fi


        echo ""
        echo "[5] Next.js build"

        if [ -d "$DEPLOY_PATH/.next" ]; then
          echo "OK: .next exists"
        else
          echo "ERROR: .next NOT FOUND"
          exit 1
        fi


        echo ""
        echo "[6] Public assets"

        if [ -d "$DEPLOY_PATH/public" ]; then
          echo "OK: public exists"
        else
          echo "ERROR: public NOT FOUND"
          exit 1
        fi


        echo ""
        echo "[7] Runtime config"

        if [ -f "$DEPLOY_PATH/next.config.ts" ] && [ -f "$DEPLOY_PATH/package.json" ]; then
          echo "OK: next.config.ts + package.json exist"
        else
          echo "ERROR: next.config.ts or package.json NOT FOUND"
          exit 1
        fi


        echo ""
        echo "========================================"
        echo " FIXING PERMISSIONS"
        echo "========================================"

        chown -R www:www "$DEPLOY_PATH"

        chmod 600 "$DEPLOY_PATH/.env.production.local"


        echo ""
        echo "========================================"
        echo " LEGACY CLEANUP"
        echo "========================================"

        # Stale stub manifest from the old rsync flow (Oct 2026 incident:
        # .next/package.json overwrote the real manifest). The current flow
        # never reads package.json on the server, so a tiny one is safely dead.
        if [ -f "$DEPLOY_PATH/package.json" ] && [ "$(wc -c < "$DEPLOY_PATH/package.json")" -lt 100 ]; then
          echo "Removing stale stub package.json"
          rm -f "$DEPLOY_PATH/package.json"
        fi


        echo ""
        echo "========================================"
        echo " PM2"
        echo "========================================"


        if sudo -u www pm2 list | grep -q "UmrahQu-Marketplace"; then

          echo "Application already exists."
          echo "Reloading..."

          sudo -u www pm2 reload \
            "$DEPLOY_PATH/ecosystem.config.js" \
            --env production

        else

          echo "Application not found."
          echo "Starting..."

          sudo -u www pm2 start \
            "$DEPLOY_PATH/ecosystem.config.js" \
            --env production

        fi


        echo ""
        echo "Saving PM2 process list..."

        echo ""
        echo "========================================"
        echo " HEALTH CHECK"
        echo "========================================"

        # The app must answer on :3000 before the deploy is accepted.
        # Uses the server Node (global fetch) so no curl dependency.
        HEALTH_OK=0
        for i in $(seq 1 12); do
          if sudo -u www node -e "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
            HEALTH_OK=1
            break
          fi
          echo "Waiting for app... ($i/12)"
          sleep 5
        done

        if [ "$HEALTH_OK" != "1" ]; then
          echo "ERROR: app did not become healthy on :3000 after reload"
          sudo -u www pm2 status
          exit 1
        fi

        echo "Health OK"

        # Static-asset guard: public/ must actually be served (regression trip
        # for the missing-public incident — homepage can return 200 with broken images).
        if ! sudo -u www node -e "fetch('http://localhost:3000/favicon.png').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
          echo "ERROR: static asset /favicon.png not served (public/ missing?)"
          exit 1
        fi

        echo "Static assets OK"

        sudo -u www pm2 save


        echo ""
        echo "========================================"
        echo " PM2 STATUS"
        echo "========================================"

        sudo -u www pm2 status


        echo ""
        echo "========================================"
        echo " DEPLOY COMPLETE"
        echo "========================================"

      ENDSSH

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  environment:
    name: production


# ─────────────────────────────────────────────
# NOTIFY (Telegram)
# Requires CI/CD variables (Settings → CI/CD → Variables,
# masked + protected): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Missing vars => graceful skip so notify never fails the pipeline.
# ─────────────────────────────────────────────

.notify-base:
  stage: notify
  image: $ALPINE_IMAGE
  tags:
    - server5
  before_script:
    - apk add --no-cache curl
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

notify-failure:
  extends: .notify-base
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_failure
  script:
    - |
      if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
        echo "Telegram vars unset, skipping notification"
        exit 0
      fi
      curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=DEPLOY FAILED: ${CI_PROJECT_NAME} [${CI_COMMIT_BRANCH}] ${CI_COMMIT_SHORT_SHA} - ${CI_COMMIT_TITLE} | ${CI_PIPELINE_URL}" > /dev/null

notify-success:
  extends: .notify-base
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - |
      if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
        echo "Telegram vars unset, skipping notification"
        exit 0
      fi
      curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=DEPLOY OK: ${CI_PROJECT_NAME} [${CI_COMMIT_BRANCH}] ${CI_COMMIT_SHORT_SHA} - ${CI_COMMIT_TITLE} | ${CI_PIPELINE_URL}" > /dev/null