stages:
  - install
  - lint
  - build
  - deploy

variables:
  NODE_VERSION: "24"
  DEPLOY_PATH: "/www/wwwroot/UmrahQu-Marketplace"

default:
  image: node:${NODE_VERSION}

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .next/cache/

# ─── Stage 1: Install ───────────────────────────────────────
install:
  stage: install
  script:
    - npm ci
  only:
    - main

# ─── Stage 2: Lint ──────────────────────────────────────────
lint:
  stage: lint
  script:
    - npm run lint
  only:
    - main

# ─── Stage 3: Build di Runner ───────────────────────────────
build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
      - node_modules/
      - package.json
      - package-lock.json
      - ecosystem.config.js
    expire_in: 1 hour
  only:
    - main

# ─── Stage 4: Deploy ke Server ──────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build
      artifacts: true
  before_script:
    - apk add --no-cache rsync openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    # Rsync ke server
    - |
      rsync -avz --delete \
        --exclude='.git' \
        --exclude='node_modules/.cache' \
        --exclude='.next/cache' \
        --exclude='.env*' \
        --exclude='.agents' \
        -e "ssh -o StrictHostKeyChecking=no" \
        .next/ node_modules/ package.json package-lock.json ecosystem.config.js \
        "umrahqu:${DEPLOY_PATH}/"

    # Setup & jalankan di server
    - |
      ssh -o StrictHostKeyChecking=no "umrahqu" << 'ENDSSH'
        set -e

        # Pastikan direktori dimiliki oleh www
        chown -R www:www /www/wwwroot/UmrahQu-Marketplace
        chown -R www:www /www/wwwlogs 2>/dev/null || true

        # Switch ke www user dan jalankan setup
        su - www -s /bin/bash << 'ENDUSER'
          set -e
          cd /www/wwwroot/UmrahQu-Marketplace

          # Install Node.js 24 jika belum ada
          if ! command -v node &> /dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
            apt-get install -y nodejs
          fi

          # Install PM2 global jika belum ada
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
            pm2 startup
          fi

          # Install production dependencies
          npm ci --omit=dev --ignore-scripts 2>/dev/null || true

          # Buat logs directory
          mkdir -p /www/wwwlogs

          # Reload atau start PM2
          if pm2 list | grep -q "UmrahQu-Marketplace"; then
            pm2 reload ecosystem.config.js --env production
          else
            pm2 start ecosystem.config.js --env production
          fi

          pm2 save
          echo "✅ Deploy complete!"
        ENDUSER
      ENDSSH
  only:
    - main
  environment:
    name: production
    url: https://yourdomain.com
