stages:
  - install
  - lint
  - build
  - deploy

variables:
  DEPLOY_PATH: "/www/wwwroot/UmrahQu-Marketplace"

default:
  image: node:24
  tags:
    - server5

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/
    - .next/cache/

install:
  stage: install
  before_script:
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version
  script:
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

lint:
  stage: lint
  needs:
    - job: install
      artifacts: true
  before_script:
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version
  script:
    - bun run lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build:
  stage: build
  needs:
    - job: lint
      artifacts: true
  before_script:
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version
  script:
    - cp "$ENV_PRODUCTION" .env.production.local
    - bun run build
  artifacts:
    paths:
      - .next/
      - node_modules/
      - ecosystem.config.js
      - .env.production.local
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine:latest

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache rsync openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/deploy_key
    - chmod 644 ~/.ssh/known_hosts

  script:
    - ssh -i ~/.ssh/deploy_key root@192.168.1.210 "echo 'SSH connection OK'"

    - |
      rsync -az --delete \
        --exclude='.next/cache' \
        -e "ssh -i ~/.ssh/deploy_key" \
        .next/ \
        node_modules/ \
        ecosystem.config.js \
        root@192.168.1.210:${DEPLOY_PATH}/

    - |
      rsync -az \
        --chmod=600 \
        -e "ssh -i ~/.ssh/deploy_key" \
        .env.production.local \
        root@192.168.1.210:${DEPLOY_PATH}/

    - |
      ssh -i ~/.ssh/deploy_key root@192.168.1.210 << 'ENDSSH'
        set -e

        DEPLOY_PATH="/www/wwwroot/UmrahQu-Marketplace"

        chown -R www:www "$DEPLOY_PATH"
        chmod 600 "$DEPLOY_PATH/.env.production.local"

        if sudo -u www pm2 list | grep -q "UmrahQu-Marketplace"; then
          sudo -u www pm2 reload "$DEPLOY_PATH/ecosystem.config.js" --env production
        else
          sudo -u www pm2 start "$DEPLOY_PATH/ecosystem.config.js" --env production
        fi

        sudo -u www pm2 save

        echo "Deploy complete!"
      ENDSSH

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  environment:
    name: production