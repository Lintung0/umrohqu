stages:
  - install
  - lint
  - build
  - deploy

variables:
  NODE_VERSION: "24"
  DEPLOY_PATH: "/www/wwwroot/UmrahQu-Marketplace"

default:
  image: node:${NODE_VERSION}
  tags:
    - server5
  before_script:
    - curl -fsSL https://bun.sh/install | bash
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"
    - bun --version
    - node --version

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/
    - .next/cache/

# ─────────────────────────────────────────────
# INSTALL
# ─────────────────────────────────────────────

install:
  stage: install
  script:
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
      - package.json
      - bun.lock
    expire_in: 1 hour
  only:
    - main

# ─────────────────────────────────────────────
# LINT
# ─────────────────────────────────────────────

lint:
  stage: lint
  needs:
    - job: install
      artifacts: true
  script:
    - bun run lint
  only:
    - main

# ─────────────────────────────────────────────
# BUILD
# ─────────────────────────────────────────────

build:
  stage: build
  needs:
    - job: install
      artifacts: true
  script:
    - bun run build
  artifacts:
    paths:
      - .next/
      - node_modules/
      - package.json
      - bun.lock
      - ecosystem.config.js
    expire_in: 1 hour
  only:
    - main

# ─────────────────────────────────────────────
# DEPLOY
# ─────────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:latest

  tags:
    - server5

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache rsync openssh-client

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key

    - echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:

    # Test SSH
    - ssh -i ~/.ssh/deploy_key root@192.168.1.210 "echo 'SSH connection OK'"

    # Deploy files
    - |
      rsync -az --delete \
        --exclude='.git' \
        --exclude='.env*' \
        --exclude='.agents' \
        --exclude='.next/cache' \
        -e "ssh -i ~/.ssh/deploy_key" \
        .next/ \
        node_modules/ \
        package.json \
        bun.lock \
        ecosystem.config.js \
        root@192.168.1.210:${DEPLOY_PATH}/

    # Restart application
    - |
      ssh -i ~/.ssh/deploy_key root@192.168.1.210 << 'ENDSSH'
        set -e

        cd /www/wwwroot/UmrahQu-Marketplace

        chown -R www:www /www/wwwroot/UmrahQu-Marketplace

        su - www -s /bin/bash -c '
          cd /www/wwwroot/UmrahQu-Marketplace

          if pm2 list | grep -q "UmrahQu-Marketplace"; then
            pm2 reload ecosystem.config.js --env production
          else
            pm2 start ecosystem.config.js --env production
          fi

          pm2 save
        '

        echo "Deploy complete!"
      ENDSSH

  only:
    - main

  environment:
    name: production
    url: https://yourdomain.com