stages:
  - install
  - lint
  - build
  - deploy

variables:
  DEPLOY_PATH: "/www/wwwroot/UmrahQu-Marketplace"

default:
  image: node:24
  tags:
    - server5

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/
    - .next/cache/

install:
  stage: install
  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version
  script:
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

lint:
  stage: lint
  needs:
    - job: install
      artifacts: true
  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version
  script:
    - bun run lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build:
  stage: build
  needs:
    - job: lint
      artifacts: true
  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version
  script:
    - cp "$ENV_PRODUCTION" .env.production.local
    - bun run build
  artifacts:
    paths:
      - .next/
      - package.json
      - bun.lock
      - ecosystem.config.js
      - .env.production.local
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine:latest

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache rsync openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/deploy_key
    - chmod 644 ~/.ssh/known_hosts

  script:
    - ssh -i ~/.ssh/deploy_key root@192.168.1.210 "echo 'SSH connection OK'"

    - |
      rsync -az --delete \
        --exclude='.next/cache' \
        -e "ssh -i ~/.ssh/deploy_key" \
        .next/ \
        package.json \
        bun.lock \
        ecosystem.config.js \
        root@192.168.1.210:${DEPLOY_PATH}/

    - |
      rsync -az \
        --chmod=600 \
        -e "ssh -i ~/.ssh/deploy_key" \
        .env.production.local \
        root@192.168.1.210:${DEPLOY_PATH}/

    - |
      ssh -i ~/.ssh/deploy_key root@192.168.1.210 << 'ENDSSH'
        set -e

        DEPLOY_PATH="/www/wwwroot/UmrahQu-Marketplace"
        NODE_BIN="/www/server/nvm/versions/node/v24.21.0/bin/node"
        PM2_BIN="/www/server/nvm/versions/node/v24.21.0/bin/pm2"
        BUN_SYS="/usr/local/bin/bun"

        # ── Provisioning: salin Bun ke system-wide jika belum ada ──
        if [ ! -x "$BUN_SYS" ]; then
          for src in /root/.bun/bin/bun "$HOME/.bun/bin/bun" /usr/local/bin/bun; do
            if [ -x "$src" ]; then
              cp "$src" "$BUN_SYS" && chmod 755 "$BUN_SYS"
              echo "Provisioned Bun: $src -> $BUN_SYS"
              break
            fi
          done
        fi
        if [ ! -x "$BUN_SYS" ]; then
          echo "ERROR: no www-accessible bun found (checked /root/.bun/bin/bun)"
          exit 1
        fi
        echo "Bun: $BUN_SYS ($("$BUN_SYS" --version))"

        # ── Permissions ──
        chown -R www:www "$DEPLOY_PATH"
        chmod 600 "$DEPLOY_PATH/.env.production.local"

        # ── Install (sama seperti CI, lolos frozen check) ──
        sudo -H -u www env NODE_ENV=development "$BUN_SYS" install --frozen-lockfile --cwd "$DEPLOY_PATH"

        # ── Prune devDependencies → production tree ──
        sudo -H -u www "$BUN_SYS" prune --production --cwd "$DEPLOY_PATH"

        # ── Preflight: pastikan biner next ada ──
        if [ ! -f "$DEPLOY_PATH/node_modules/next/dist/bin/next" ]; then
          echo "ERROR: next binary not found after install"
          exit 1
        fi

        # ── Start / Reload PM2 ──
        "$NODE_BIN" --version

        if sudo -H -u www "$NODE_BIN" "$PM2_BIN" list 2>/dev/null | grep -q "UmrahQu-Marketplace"; then
          sudo -H -u www "$NODE_BIN" "$PM2_BIN" reload "$DEPLOY_PATH/ecosystem.config.js" --env production
        else
          sudo -H -u www "$NODE_BIN" "$PM2_BIN" start "$DEPLOY_PATH/ecosystem.config.js" --env production
        fi

        sudo -H -u www "$NODE_BIN" "$PM2_BIN" save

        echo "Deploy complete!"
      ENDSSH

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  environment:
    name: production
